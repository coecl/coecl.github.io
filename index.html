<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Under Construction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05070a;
      --text: #f5f7fa;
      --muted: #8b949e;
      --accent: #67f5c7;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(circle at 50% 20%, rgba(103, 245, 199, 0.10), transparent 35%),
        #05070a;

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

      background-size: 40px 40px;

      mask-image:
        linear-gradient(to bottom, black, transparent 90%);

      pointer-events: none;
    }

    .glow {
      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background: rgba(103, 245, 199, 0.07);

      filter: blur(100px);

      animation: float 6s ease-in-out infinite alternate;

      pointer-events: none;
    }

    @keyframes float {
      from {
        transform: translate(-80px, -50px);
      }

      to {
        transform: translate(80px, 40px);
      }
    }

    .container {
      width: min(900px, 100%);

      position: relative;

      z-index: 2;
    }

    .status {
      display: inline-flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 28px;

      color: var(--accent);

      font-size: 0.8rem;
      font-weight: 700;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 16px var(--accent);

      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .35;
      }
    }

    h1 {
      max-width: 800px;

      font-size: clamp(4rem, 12vw, 9rem);

      line-height: .85;

      letter-spacing: -.07em;

      font-weight: 800;
    }

    .accent {
      color: var(--accent);
    }

    p {
      max-width: 590px;

      margin-top: 32px;

      color: var(--muted);

      font-size: clamp(1rem, 2vw, 1.2rem);

      line-height: 1.7;
    }

    .stack {
      display: flex;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: 34px;
    }

    .stack span {
      padding: 8px 12px;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 999px;

      background: rgba(255,255,255,.025);

      color: #c9d1d9;

      font-size: .82rem;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-top: 70px;

      color: #59636f;

      font-size: .8rem;
    }

    .links {
      display: flex;
      gap: 18px;
    }

    .links a {
      color: #8b949e;

      text-decoration: none;

      transition: .2s;
    }

    .links a:hover {
      color: var(--accent);
    }

    .cursor {
      display: inline-block;

      width: .08em;
      height: .8em;

      margin-left: .08em;

      background: var(--accent);

      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      footer {
        flex-direction: column;
        align-items: flex-start;

        margin-top: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <main class="container">

    <div class="status">
      <span class="dot"></span>
      Portfolio in progress
    </div>

    <h1>
      BUILDING<br>
      SOMETHING<br>
      <span class="accent">BETTER.</span>
      <span class="cursor"></span>
    </h1>

    <p>
      My portfolio is currently under construction.
      I'm building projects across software engineering,
      cybersecurity, cloud infrastructure and AI.
    </p>

    <div class="stack">
      <span>Software Engineering</span>
      <span>Cybersecurity</span>
      <span>Cloud</span>
      <span>AI</span>
    </div>

    <footer>

      <span>
        © <span id="year"></span> Your Name
      </span>

      <div class="links">
        <a href="https://github.com/YOURUSERNAME">GitHub</a>
        <a href="https://linkedin.com/in/YOURUSERNAME">LinkedIn</a>
        <a href="mailto:you@example.com">Email</a>
      </div>

    </footer>

  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
