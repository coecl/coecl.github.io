
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Under Construction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05070a;
      --text: #f5f7fa;
      --muted: #8b949e;
      --accent: #67f5c7;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        clamp(20px, 4vw, 64px);

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(103, 245, 199, 0.10),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );

      background-size:
        clamp(28px, 3vw, 46px)
        clamp(28px, 3vw, 46px);

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 92%
        );

      pointer-events: none;
    }

    .glow {
      position: fixed;

      width: min(55vw, 700px);
      aspect-ratio: 1;

      border-radius: 50%;

      background:
        rgba(103, 245, 199, 0.07);

      filter:
        blur(clamp(70px, 8vw, 130px));

      pointer-events: none;

      animation:
        float 7s ease-in-out infinite alternate;
    }

    @keyframes float {
      from {
        transform:
          translate(-6vw, -4vh);
      }

      to {
        transform:
          translate(6vw, 4vh);
      }
    }

    .container {
      width:
        min(
          100%,
          1100px
        );

      position: relative;

      z-index: 2;
    }

    .status {
      display: inline-flex;
      align-items: center;

      gap:
        clamp(7px, 0.7vw, 10px);

      margin-bottom:
        clamp(18px, 2.5vh, 32px);

      color: var(--accent);

      font-size:
        clamp(
          0.68rem,
          0.7vw,
          0.82rem
        );

      font-weight: 700;

      letter-spacing:
        clamp(
          0.11em,
          0.15vw,
          0.16em
        );

      text-transform: uppercase;
    }

    .dot {
      width:
        clamp(6px, 0.5vw, 8px);

      aspect-ratio: 1;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0
        clamp(10px, 1vw, 18px)
        var(--accent);

      animation:
        pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    h1 {
      max-width:
        min(
          95vw,
          1050px
        );

      font-size:
        clamp(
          3.2rem,
          9vw,
          8.5rem
        );

      line-height:
        0.86;

      letter-spacing:
        -0.065em;

      font-weight: 800;

      text-wrap: balance;
    }

    .accent {
      color: var(--accent);
    }

    .cursor {
      display: inline-block;

      width:
        clamp(
          4px,
          0.5vw,
          9px
        );

      height:
        0.78em;

      margin-left:
        0.05em;

      background: var(--accent);

      animation:
        blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .description {
      max-width:
        min(
          650px,
          90vw
        );

      margin-top:
        clamp(
          22px,
          3vh,
          38px
        );

      color: var(--muted);

      font-size:
        clamp(
          0.92rem,
          1.2vw,
          1.2rem
        );

      line-height:
        clamp(
          1.55,
          1.7,
          1.75
        );
    }

    .stack {
      display: flex;
      flex-wrap: wrap;

      gap:
        clamp(
          8px,
          0.8vw,
          12px
        );

      margin-top:
        clamp(
          22px,
          3vh,
          36px
        );
    }

    .stack span {
      padding:
        clamp(7px, 0.7vw, 9px)
        clamp(10px, 1vw, 14px);

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      border-radius:
        999px;

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );

      color:
        #c9d1d9;

      font-size:
        clamp(
          0.72rem,
          0.8vw,
          0.86rem
        );

      white-space: nowrap;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap:
        20px;

      margin-top:
        clamp(
          38px,
          7vh,
          80px
        );

      color:
        #59636f;

      font-size:
        clamp(
          0.7rem,
          0.75vw,
          0.82rem
        );
    }

    .links {
      display: flex;
      flex-wrap: wrap;

      gap:
        clamp(
          12px,
          1.4vw,
          20px
        );
    }

    .links a {
      color:
        #8b949e;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }

    .links a:hover {
      color:
        var(--accent);
    }

    /*
      Smaller laptops / short screens
    */
    @media (max-height: 760px) and (min-width: 700px) {

      body {
        align-items: flex-start;

        padding-top:
          clamp(
            24px,
            5vh,
            48px
          );
      }

      h1 {
        font-size:
          clamp(
            3rem,
            7vw,
            6.5rem
          );
      }

      .description {
        margin-top: 20px;
      }

      .stack {
        margin-top: 20px;
      }

      footer {
        margin-top: 36px;
      }
    }

    /*
      Tablets
    */
    @media (max-width: 850px) {

      .container {
        width: 100%;
      }

      h1 {
        font-size:
          clamp(
            3.5rem,
            13vw,
            7rem
          );

        line-height:
          0.88;
      }

      .description {
        max-width:
          580px;
      }
    }

    /*
      Phones
    */
    @media (max-width: 600px) {

      body {
        align-items: flex-start;

        padding:
          max(
            26px,
            env(safe-area-inset-top)
          )
          20px
          max(
            26px,
            env(safe-area-inset-bottom)
          );
      }

      .container {
        margin-top:
          clamp(
            28px,
            8vh,
            90px
          );
      }

      h1 {
        font-size:
          clamp(
            3.3rem,
            17vw,
            5.8rem
          );

        letter-spacing:
          -0.07em;

        line-height:
          0.88;
      }

      .description {
        max-width:
          100%;

        font-size:
          clamp(
            0.92rem,
            4vw,
            1.05rem
          );
      }

      footer {
        flex-direction: column;
        align-items: flex-start;

        margin-top:
          clamp(
            42px,
            8vh,
            70px
          );
      }
    }

    /*
      Very small phones
    */
    @media (max-width: 380px) {

      body {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        font-size:
          clamp(
            3rem,
            16vw,
            4.2rem
          );
      }

      .stack {
        gap: 7px;
      }

      .stack span {
        font-size:
          0.7rem;

        padding:
          7px 9px;
      }
    }

    /*
      Very large / ultrawide screens
    */
    @media (min-width: 1600px) {

      .container {
        width:
          min(
            70vw,
            1250px
          );
      }

      h1 {
        font-size:
          clamp(
            7rem,
            7.4vw,
            10rem
          );
      }

      .description {
        max-width:
          720px;
      }
    }

    @media (
      prefers-reduced-motion: reduce
    ) {

      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <main class="container">

    <div class="status">
      <span class="dot"></span>
      Portfolio in progress
    </div>


    <h1>

      BUILDING
      <br>

      SOMETHING
      <br>

      <span class="accent">
        BETTER.
      </span>

      <span class="cursor"></span>

    </h1>


    <p class="description">

      My portfolio is currently under construction.
      I'm building projects across software engineering,
      cybersecurity, cloud infrastructure and AI.

    </p>


    <div class="stack">

      <span>
        Software Engineering
      </span>

      <span>
        Cybersecurity
      </span>

      <span>
        Cloud
      </span>

      <span>
        AI
      </span>

    </div>


    <footer>

      <span>

        ©
        <span id="year"></span>
        Your Name

      </span>


      <div class="links">

        <a
          href="https://github.com/YOURUSERNAME"
          target="_blank"
        >
          GitHub
        </a>

        <a
          href="https://linkedin.com/in/YOURUSERNAME"
          target="_blank"
        >
          LinkedIn
        </a>

        <a
          href="mailto:you@example.com"
        >
          Email
        </a>

      </div>

    </footer>

  </main>


  <script>

    document
      .getElementById("year")
      .textContent =
        new Date().getFullYear();

  </script>

</body>
</html>
